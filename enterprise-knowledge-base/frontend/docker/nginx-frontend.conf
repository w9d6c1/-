# Frontend Nginx 生产配置 — Vue SPA + React 管理后台 (/app/) + gzip + 安全头
server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript text/markdown;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # React 管理后台
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    location /app/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Vue 前端
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
