#
# CRS Exclusion Rules — 知识库系统白名单
#

#
# 1. 放行 SSE 流式响应 (Server-Sent Events)
#    SSE 使用长连接 text/event-stream，CRS 可能将长连接 HTTP 行为误判为异常
#
SecRule REQUEST_URI "@beginsWith /api/agent/" \
    "id:10001,phase:1,nolog,pass,\
    ctl:ruleRemoveById=920420,\
    ctl:ruleRemoveById=949110,\
    ctl:ruleRemoveById=941100,\
    ctl:ruleRemoveById=941160,\
    ctl:ruleRemoveById=941170,\
    ctl:ruleRemoveById=941180,\
    ctl:ruleRemoveById=941190,\
    ctl:ruleRemoveTargetById=942100;ARGS:question,\
    ctl:ruleRemoveTargetById=942100;ARGS:message,\
    ctl:ruleRemoveTargetById=942430;ARGS:question,\
    ctl:ruleRemoveTargetById=942430;ARGS:message,\
    ctl:ruleRemoveTargetById=941370;ARGS:question,\
    ctl:ruleRemoveTargetById=941370;ARGS:message,\
    ctl:ruleRemoveTargetById=941380;ARGS:question,\
    ctl:ruleRemoveTargetById=941380;ARGS:message,\
    ctl:ruleRemoveTargetById=932150;ARGS:question,\
    ctl:ruleRemoveTargetById=932150;ARGS:message"


#
# 2. 放行管理后台文件上传 (application/octet-stream)
#    CRS 可能限制二进制 Content-Type
#
SecRule REQUEST_URI "@beginsWith /api/admin/documents" \
    "id:10002,phase:1,nolog,pass,\
    ctl:ruleRemoveById=920420,\
    ctl:ruleRemoveById=920440,\
    ctl:ruleRemoveById=200003"


#
# 3. 放行管理后台 FAQ 批量导入 (CSV / Excel)
#
SecRule REQUEST_URI "@beginsWith /api/admin/faqs" \
    "id:10003,phase:1,nolog,pass,\
    ctl:ruleRemoveById=920420,\
    ctl:ruleRemoveById=920440"


#
# 4. 放行 Grafana 代理路径 (不经过 WAF 安全检查)
#
SecRule REQUEST_URI "@beginsWith /grafana/" \
    "id:10004,phase:1,nolog,pass,\
    ctl:ruleRemoveById=920420"


#
# 5. 管理后台内容中的合法 HTML (CRS 会将 HTML 片段视为 XSS)
#    放行 knowledge_doc content 字段中包含的合法标记文本
#
SecRule REQUEST_URI "@beginsWith /api/admin/" \
    "id:10005,phase:1,nolog,pass,\
    ctl:ruleRemoveTargetById=941100;ARGS:content,\
    ctl:ruleRemoveTargetById=941160;ARGS:content,\
    ctl:ruleRemoveTargetById=941170;ARGS:content,\
    ctl:ruleRemoveTargetById=941180;ARGS:content,\
    ctl:ruleRemoveTargetById=941190;ARGS:content,\
    ctl:ruleRemoveTargetById=941110;ARGS:content,\
    ctl:ruleRemoveTargetById=941120;ARGS:content,\
    ctl:ruleRemoveTargetById=941130;ARGS:content,\
    ctl:ruleRemoveTargetById=941140;ARGS:content,\
    ctl:ruleRemoveTargetById=941150;ARGS:content,\
    ctl:ruleRemoveTargetById=973300;ARGS:content,\
    ctl:ruleRemoveTargetById=973301;ARGS:content,\
    ctl:ruleRemoveTargetById=973302;ARGS:content,\
    ctl:ruleRemoveTargetById=973303;ARGS:content,\
    ctl:ruleRemoveTargetById=973304;ARGS:content,\
    ctl:ruleRemoveTargetById=973305;ARGS:content,\
    ctl:ruleRemoveTargetById=973306;ARGS:content,\
    ctl:ruleRemoveTargetById=973307;ARGS:content,\
    ctl:ruleRemoveTargetById=973308;ARGS:content,\
    ctl:ruleRemoveTargetById=973309;ARGS:content"


#
# 6. 放行 Import Seed Data 脚本发送的批量请求
#
SecRule REQUEST_URI "@beginsWith /api/admin/import" \
    "id:10006,phase:1,nolog,pass,\
    ctl:ruleRemoveById=920420"
