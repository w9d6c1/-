services:
  # ========== WAF (ModSecurity + OWASP CRS) ==========
  waf:
    image: owasp/modsecurity-crs:nginx
    container_name: kb-waf
    user: "0:0"
    ports:
      - "8080:8080"
    volumes:
      - ./docker/waf/waf-proxy.conf:/tmp/waf-proxy.conf:ro
    command: /bin/sh -c "/docker-entrypoint.sh nginx -t 2>/dev/null; cp /tmp/waf-proxy.conf /etc/nginx/conf.d/default.conf; exec nginx -g 'daemon off;'"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    env_file:
      - .env
    environment:
      - ALLOWED_METHODS=GET HEAD POST PUT PATCH DELETE OPTIONS
      - MODSEC_REQ_BODY_LIMIT=52428800
      - MODSEC_REQ_BODY_NOFILES_LIMIT=5242880
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks:
      - kb-network

  # ========== Nginx 网关 ==========
  nginx:
    image: nginx:1.27-alpine
    container_name: kb-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
    depends_on:
      waf:
        condition: service_started
      frontend:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    networks:
      - kb-network

  # ========== FastAPI 后端 ==========
  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
      target: dev
    container_name: kb-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./models:/app/models:ro
      - /app/__pycache__
    env_file:
      - .env
    environment:
      - WATCHFILES_FORCE_POLLING=true
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      milvus:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
    networks:
      - kb-network

  # ========== 采集服务（独立隔离，profile=collector，默认不启动）==========
  # 启用: docker compose --profile collector up -d collector
  # 启用后建议关闭后端调度器中的 collector_daily_sync 任务以避免重复同步。
  collector:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
      target: dev
    container_name: kb-collector
    profiles:
      - collector
    volumes:
      - ./backend:/app
      - ./models:/app/models:ro
      - /app/__pycache__
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      milvus:
        condition: service_healthy
    command: python -m app.collector.scheduler_main
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    networks:
      - kb-network

  # ========== Vue3 前端（含 React 管理后台合并构建）==========
  frontend:
    build:
      context: .
      dockerfile: frontend/docker/Dockerfile
      target: dev
    container_name: kb-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - WATCHFILES_FORCE_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      backend:
        condition: service_started
    command: npm run dev -- --host 0.0.0.0
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks:
      - kb-network

  # ========== React 管理后台 (Vite dev, base=/app/) ==========
  # 开发态通过 nginx 的 /app/ 代理到本容器 5175；npm install 仅在首次执行。
  # 注：node 镜像源暂时不可用，故复用本地构建的 frontend dev 镜像(node:22-alpine+npm)，
  #     待镜像源恢复可改回 image: node:22-alpine。
  app:
    image: enterprise-knowledge-base-frontend:latest
    container_name: kb-app
    working_dir: /app
    ports:
      - "5175:5175"
    volumes:
      - ./app:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - API_PROXY_TARGET=http://backend:8000
      - CHOKIDAR_USEPOLLING=true
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5175"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    networks:
      - kb-network

  # ========== 发布桥接器（Wechatsync CLI + Chrome 扩展路由）==========
  # 宿主机 Chrome 扩展通过 9531-9538 连接容器内 CLI；后端经 host.docker.internal:3010 调用
  publisher-bridge:
    build:
      context: ./publisher-bridge
      dockerfile: Dockerfile
    container_name: kb-publisher-bridge
    ports:
      - "3010:3010"
      - "9531-9538:9531-9538"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks:
      - kb-network

  # ========== MySQL 8.0 ==========
  mysql:
    image: mysql:8.0
    container_name: kb-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_pass_2024
      MYSQL_USER: ${MYSQL_USER:-kb_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-kb_pass_2024}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-knowledge_base}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_pass_2024"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    networks:
      - kb-network

  # ========== PostgreSQL (LangGraph Checkpoint) ==========
  postgres:
    image: postgres:16-alpine
    container_name: kb-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pg_pass_2024}
      POSTGRES_DB: ${POSTGRES_DB:-langgraph_checkpoint}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks:
      - kb-network

  # ========== Redis ==========
  redis:
    image: redis:7-alpine
    container_name: kb-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.3"
    networks:
      - kb-network

  # ========== Elasticsearch 8.x ==========
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: kb-elasticsearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - ELASTIC_USERNAME=
      - ELASTIC_PASSWORD=
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -vq red"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
    networks:
      - kb-network

  # ========== Milvus 向量数据库 ==========
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: kb-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks:
      - kb-network

  minio:
    image: minio/minio:latest
    container_name: kb-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    command: minio server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks:
      - kb-network

  milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: kb-milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: ["milvus", "run", "standalone"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
    networks:
      - kb-network

  # ========== Prometheus 监控 ==========
  prometheus:
    image: prom/prometheus:latest
    container_name: kb-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks:
      - kb-network

  # ========== Grafana 可视化 ==========
  grafana:
    image: grafana/grafana:latest
    container_name: kb-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      # - GF_INSTALL_PLUGINS=grafana-piechart-panel  # 网络不通时禁用自动安装
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.3"
    networks:
      - kb-network

  # ========== Loki 日志聚合 ==========
  loki:
    image: grafana/loki:2.9.0
    container_name: kb-loki
    ports:
      - "3100:3100"
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks:
      - kb-network

  promtail:
    image: grafana/promtail:2.9.0
    container_name: kb-promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/loki/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.2"
    networks:
      - kb-network

volumes:
  mysql-data:
  postgres-data:
  redis-data:
  es-data:
  etcd-data:
  minio-data:
  milvus-data:
  prometheus-data:
  grafana-data:
  loki-data:

networks:
  kb-network:
    driver: bridge
